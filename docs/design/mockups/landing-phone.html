<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Landing — phone</title>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #1a1a1a;
        --muted: #f4f4f5;
        --muted-fg: #71717a;
        --border: #e4e4e7;
        --primary: #18181b;
        --primary-fg: #fafafa;
        --radius: 10px;
        --font: "Inter", system-ui, -apple-system, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        font-family: var(--font);
        background: var(--bg);
        color: var(--fg);
        -webkit-font-smoothing: antialiased;
      }
      .phone {
        width: 390px;
        height: 844px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 28px;
        overflow: hidden;
      }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 48px;
        padding: 0 16px;
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }
      .mark {
        font-weight: 600;
        font-size: 15px;
        letter-spacing: -0.01em;
      }
      .toplink {
        font-size: 14px;
        color: var(--muted-fg);
        text-decoration: none;
      }
      .prompt-slot {
        min-height: 0;
        padding: 0 20px;
        color: var(--muted-fg);
        font-size: 14px;
        line-height: 1.4;
      }
      .writing {
        flex: 1 1 auto;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      textarea {
        flex: 1 1 auto;
        width: 100%;
        border: 0;
        outline: 0;
        resize: none;
        background: transparent;
        color: var(--fg);
        font: inherit;
        font-size: 18px;
        line-height: 1.6;
        padding: 20px;
        min-height: 0;
      }
      textarea::placeholder {
        color: var(--muted-fg);
      }
      .toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 56px;
        padding: 0 12px;
        border-top: 1px solid var(--border);
        flex-shrink: 0;
      }
      .record-slot {
        width: 40px;
        height: 40px;
        border-radius: 999px;
        background: var(--muted);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--muted-fg);
        font-size: 11px;
        flex-shrink: 0;
      }
      .hint {
        flex: 1 1 auto;
        text-align: center;
        font-size: 12px;
        color: var(--muted-fg);
      }
      .btn {
        background: var(--primary);
        color: var(--primary-fg);
        border: 0;
        border-radius: var(--radius);
        padding: 10px 16px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        flex-shrink: 0;
      }
      .btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .live {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
      }
      .counter {
        padding: 0 20px 8px;
        font-size: 11px;
        color: var(--muted-fg);
        text-align: right;
      }
    </style>
  </head>
  <body>
    <div class="phone">
      <div class="topbar">
        <span class="mark">Memento</span>
        <a class="toplink" href="#">Thoughts</a>
      </div>
      <div class="prompt-slot" aria-hidden="true">
        <!-- reserved prompt slot -->
      </div>
      <div class="writing">
        <textarea
          aria-label="Capture a thought"
          placeholder="What's on your mind?"
          rows="1"
        ></textarea>
      </div>
      <div class="counter">0 / 10,000</div>
      <div class="toolbar">
        <div
          class="record-slot"
          aria-hidden="true"
          title="record (reserved for #3)"
        >
          mic
        </div>
        <span class="hint">⌘↵ to save</span>
        <button class="btn" disabled>Capture</button>
      </div>
      <span class="live" aria-live="polite"></span>
    </div>
  </body>
</html>
